name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      # Type-check every platform's view, not just the runner's. A literal
      # sys.platform comparison narrows to a constant for whichever platform
      # mypy thinks it is on, so macOS-only branches read as unreachable on
      # Linux -- and Windows genuinely lacks the Unix-socket API. Checking one
      # platform hides both.
      - run: uv run mypy --platform linux
      - run: uv run mypy --platform darwin
      - run: uv run mypy --platform win32

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest --cov=relaykit --cov-report=xml -q

  conformance:
    name: conformance (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference engine gates every PR: it is the proof the contract is
          # satisfiable, so a change that breaks it broke the contract.
          - { engine: playwright, os: ubuntu-latest, required: true }
          # Chrome runs its DevTools pipe here; the extension pipe cannot be
          # exercised without a real browser profile. See docs/porting/chrome.md.
          - { engine: chrome, os: ubuntu-latest, required: true }
          # Safari's perception half is unwritten, so probe() refuses and the
          # whole contract skips. Running it anyway is not theatre: it proves
          # the engine imports on macOS and refuses *cleanly*, which is the
          # behaviour the registry depends on to fall through to another engine.
          - { engine: safari, os: macos-latest, required: true }
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run playwright install --with-deps chromium
        if: matrix.engine == 'playwright'
      # The Chrome engine launches a real Chrome; the runner image does not
      # always have one where it looks.
      - uses: browser-actions/setup-chrome@v1
        if: matrix.engine == 'chrome'
      - run: uv run pytest --pyargs relaykit_conformance --engine ${{ matrix.engine }} -q -rs

  transports:
    name: conformance (transport ${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [memory, unix, websocket]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest --pyargs relaykit_conformance --transport ${{ matrix.transport }} -q -rs

  build:
    name: wheel is not a lie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # A green source tree with a broken wheel is the failure mode this catches,
      # and it has caught two already: assets read from disk at runtime that the
      # package data omitted, and `relaykit.engines` the subpackage shadowing the
      # registry of the same name -- which survived in a checkout on import-order
      # luck and broke the moment it was installed. Exercise the wheel in a clean
      # environment, never in the checkout.
      - name: install and exercise the built wheel
        run: |
          uv venv /tmp/wheeltest
          VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
          cd /tmp
          /tmp/wheeltest/bin/python -c "
          import relaykit
          from relaykit.perception import COLLECT_SCRIPT, READ_SCRIPT
          from relaykit.engines.safari.build import _SOURCE, _PLIST
          from importlib.resources import files
          assert relaykit.available_engines(), 'no engines discoverable'
          assert 'deepDom' in COLLECT_SCRIPT, 'deep-DOM helpers not inlined'
          assert '__RELAYKIT_DEEP_DOM_HELPERS__' not in COLLECT_SCRIPT
          assert _SOURCE.exists() and _PLIST.exists(), 'Swift helper missing'
          assert (files('relaykit_conformance')/'pages'/'index.html').is_file()
          print('wheel ok:', relaykit.__version__, relaykit.available_engines())
          "
