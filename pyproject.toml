[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anybrowser"
version = "0.2.0"
description = "A pluggable browser-automation and agent runtime. Bring your own browser, transport, or model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AnyBrowser contributors" }]
keywords = ["browser", "automation", "agent", "cdp", "safari", "chrome", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# The floor is deliberately tiny. `import anybrowser` must not pull in a browser
# driver, an HTTP server or an LLM SDK -- every backend is an extra.
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
chrome = ["websockets>=12.0"]
safari = ["websockets>=12.0"]
daemon = ["websockets>=12.0"]
agent = ["httpx>=0.27", "pillow>=10.0"]
cli = ["typer>=0.12", "rich>=13.0"]
all = ["anybrowser[playwright,chrome,safari,daemon,agent,cli]"]
dev = [
    "anybrowser[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
anybrowser = "anybrowser.cli.main:main"

# Registered as a pytest plugin so `--engine` works from any rootdir, which is
# what makes `pytest --pyargs anybrowser_conformance --engine yours` a one-liner
# in a third-party backend's own repo.
[project.entry-points.pytest11]
anybrowser_conformance = "anybrowser_conformance.plugin"

[project.entry-points."anybrowser.engines"]
playwright = "anybrowser.engines.playwright:PlaywrightEngine"
chrome = "anybrowser.engines.chrome:ChromeEngine"
safari = "anybrowser.engines.safari:SafariEngine"
# A daemon client IS an engine, so it registers as one. Pointing the engine
# conformance suite at `remote` grades the whole daemon stack -- transport,
# protocol, codec, dispatch and the real engine at the far end.
remote = "anybrowser.daemon:RemoteEngine"

[project.entry-points."anybrowser.transports"]
websocket = "anybrowser.daemon.transports.websocket:WebSocketTransport"
unix = "anybrowser.daemon.transports.unix:UnixSocketTransport"
memory = "anybrowser.daemon.transports.memory:MemoryTransport"

[project.entry-points."anybrowser.models"]
openai = "anybrowser.models.openai_compatible:OpenAICompatibleProvider"
anthropic = "anybrowser.models.anthropic:AnthropicProvider"

[project.urls]
Homepage = "https://github.com/christopher-inegbedion/anybrowser"
Documentation = "https://github.com/christopher-inegbedion/anybrowser/tree/main/docs"
Source = "https://github.com/christopher-inegbedion/anybrowser"
Issues = "https://github.com/christopher-inegbedion/anybrowser/issues"
Changelog = "https://github.com/christopher-inegbedion/anybrowser/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/anybrowser", "conformance/anybrowser_conformance"]

# The page-side JavaScript and the conformance fixture pages are loaded at
# runtime from disk. Omitting them builds a wheel that imports fine and fails on
# first use -- verified against the built wheel, not the source tree.
[tool.hatch.build.targets.sdist]
include = ["src", "conformance", "docs", "examples", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/anybrowser"]

[[tool.mypy.overrides]]
module = ["playwright.*", "websockets.*"]
ignore_missing_imports = true
