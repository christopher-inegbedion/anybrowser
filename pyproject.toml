[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relaykit"
version = "0.1.0"
description = "A pluggable browser-automation and agent runtime. Bring your own browser, transport, or model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RelayKit contributors" }]
keywords = ["browser", "automation", "agent", "cdp", "safari", "chrome", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# The floor is deliberately tiny. `import relaykit` must not pull in a browser
# driver, an HTTP server or an LLM SDK -- every backend is an extra.
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
chrome = ["websockets>=12.0"]
safari = ["websockets>=12.0"]
daemon = ["websockets>=12.0"]
agent = ["httpx>=0.27", "pillow>=10.0"]
cli = ["typer>=0.12", "rich>=13.0"]
all = ["relaykit[playwright,chrome,safari,daemon,agent,cli]"]
dev = [
    "relaykit[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
relaykit = "relaykit.cli.main:main"

# Registered as a pytest plugin so `--engine` works from any rootdir, which is
# what makes `pytest --pyargs relaykit_conformance --engine yours` a one-liner
# in a third-party backend's own repo.
[project.entry-points.pytest11]
relaykit_conformance = "relaykit_conformance.plugin"

[project.entry-points."relaykit.engines"]
playwright = "relaykit.engines.playwright:PlaywrightEngine"
chrome = "relaykit.engines.chrome:ChromeEngine"
safari = "relaykit.engines.safari:SafariEngine"

[project.entry-points."relaykit.transports"]
websocket = "relaykit.daemon.transports.websocket:WebSocketTransport"
unix = "relaykit.daemon.transports.unix:UnixSocketTransport"
memory = "relaykit.daemon.transports.memory:MemoryTransport"

[project.entry-points."relaykit.models"]
openai = "relaykit.models.openai_compatible:OpenAICompatibleProvider"
anthropic = "relaykit.models.anthropic:AnthropicProvider"

[project.urls]
Homepage = "https://github.com/christopher-inegbedion/relaykit"
Documentation = "https://github.com/christopher-inegbedion/relaykit/tree/main/docs"
Source = "https://github.com/christopher-inegbedion/relaykit"
Issues = "https://github.com/christopher-inegbedion/relaykit/issues"
Changelog = "https://github.com/christopher-inegbedion/relaykit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/relaykit", "conformance/relaykit_conformance"]

# The page-side JavaScript and the conformance fixture pages are loaded at
# runtime from disk. Omitting them builds a wheel that imports fine and fails on
# first use -- verified against the built wheel, not the source tree.
[tool.hatch.build.targets.wheel.force-include]
"conformance/relaykit_conformance/pages" = "relaykit_conformance/pages"
"src/relaykit/perception/js" = "relaykit/perception/js"
"src/relaykit/engines/safari/mac_engine" = "relaykit/engines/safari/mac_engine"

[tool.hatch.build.targets.sdist]
include = ["src", "conformance", "docs", "examples", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/relaykit"]

[[tool.mypy.overrides]]
module = ["playwright.*", "websockets.*"]
ignore_missing_imports = true
